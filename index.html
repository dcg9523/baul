<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nuestro Baúl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Fondo pastel cálido degradado hacia blanco puro */
        body { 
            background: linear-gradient(180deg, #dcc4b8 0%, #efe2db 52%, #ffffff 100%);
            overflow: hidden; 
            font-family: 'Poppins', sans-serif; 
            color: #4a3f3c; 
            touch-action: manipulation; 
        }
        .cursive { font-family: 'Dancing Script', cursive; }
        
        /* Animación del cofre flotando */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-9px); }
        }
        .float { animation: float 3s ease-in-out infinite; }
        
        /* Efecto Polaroid con borde sutil para destacar sobre el fondo blanco */
        .polaroid {
            background: #ffffff;
            padding: 12px 12px 48px 12px;
            border: 1px solid #e6d7cf;
            box-shadow: 0 20px 40px rgba(74, 63, 60, 0.16); 
            border-radius: 4px;
            transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
            opacity: 0; 
            transform: scale(0.9) rotate(-3deg);
            max-width: 85vw;
            max-height: 62vh;
            object-fit: cover;
        }
        
        .polaroid.visible { opacity: 1; transform: scale(1) rotate(3deg); }
        .polaroid.visible-alt { opacity: 1; transform: scale(1) rotate(-2deg); }

        /* Sombra natural del cofre */
        .chest-shadow {
            filter: drop-shadow(0 14px 20px rgba(74, 53, 37, 0.25));
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .chest-container:active .chest-shadow {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <audio id="musica" src="cancion.mp3" loop></audio>

    <!-- AVISO DE VOLUMEN (Aparece al abrir el baúl) -->
    <div id="aviso-volumen" class="hidden opacity-0 transition-opacity duration-700 fixed top-8 z-50 bg-white/90 backdrop-blur-md border border-[#d8c3b8] text-[#4a3f3c] px-5 py-2.5 rounded-full shadow-md flex items-center gap-2 text-sm font-medium">
        <span class="text-base">🔊</span>
        <span>Sube el volumen de tu celular...</span>
    </div>

    <!-- ESCENA 1: EL COFRE -->
    <div id="escena-baul" class="flex flex-col items-center justify-center z-40 transition-opacity duration-1000 w-full px-6">
        <h2 class="text-[#4a3f3c] text-lg sm:text-xl text-center mb-10 font-normal tracking-wide leading-relaxed">
            Buenos días amorcito y antioquia...<br>
            <span class="text-sm text-[#7d6b66] animate-pulse mt-3 block font-light">Toca el cofre para abrirlo</span>
        </h2>
        
        <!-- Cofre SVG ilustrado con madera, herrajes y cerradura -->
        <div class="chest-container cursor-pointer float select-none" onclick="abrirBaul()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" class="w-40 h-40 chest-shadow">
                <!-- Tapa del cofre (Madera) -->
                <path d="M 20 70 C 20 20, 180 20, 180 70 Z" fill="#78350f" stroke="#451a03" stroke-width="4"/>
                <path d="M 25 65 C 30 25, 170 25, 175 65" fill="none" stroke="#92400e" stroke-width="2"/>
                <path d="M 35 60 C 45 35, 155 35, 165 60" fill="none" stroke="#92400e" stroke-width="2"/>
                
                <!-- Refuerzos metálicos de la tapa -->
                <path d="M 20 70 C 20 20, 45 20, 45 70 Z" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
                <path d="M 180 70 C 180 20, 155 20, 155 70 Z" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
                <rect x="90" y="20" width="20" height="50" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
                
                <!-- Base del cofre (Madera) -->
                <rect x="20" y="70" width="160" height="70" rx="5" fill="#78350f" stroke="#451a03" stroke-width="4"/>
                <line x1="20" y1="90" x2="180" y2="90" stroke="#451a03" stroke-width="3"/>
                <line x1="20" y1="110" x2="180" y2="110" stroke="#451a03" stroke-width="3"/>
                <line x1="20" y1="130" x2="180" y2="130" stroke="#451a03" stroke-width="3"/>
                
                <!-- Refuerzos metálicos de la base -->
                <rect x="20" y="70" width="25" height="70" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
                <rect x="155" y="70" width="25" height="70" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
                
                <!-- Remaches metálicos -->
                <circle cx="32" cy="45" r="3" fill="#fbbf24"/>
                <circle cx="167" cy="45" r="3" fill="#fbbf24"/>
                <circle cx="100" cy="30" r="3" fill="#fbbf24"/>
                <circle cx="32" cy="80" r="3" fill="#fbbf24"/>
                <circle cx="32" cy="120" r="3" fill="#fbbf24"/>
                <circle cx="167" cy="80" r="3" fill="#fbbf24"/>
                <circle cx="167" cy="120" r="3" fill="#fbbf24"/>
                
                <!-- Cerradura dorada -->
                <rect x="85" y="60" width="30" height="35" rx="5" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
                <circle cx="100" cy="73" r="5" fill="#1f2937"/>
                <rect x="98" y="73" width="4" height="12" fill="#1f2937"/>
            </svg>
        </div>
    </div>

    <!-- ESCENA 2: LAS FOTOS -->
    <div id="escena-fotos" class="hidden absolute inset-0 flex-col items-center justify-center z-10 w-full h-full">
        <div id="foto-container" class="relative flex items-center justify-center w-full h-full">
            <img id="foto-actual" src="" class="polaroid">
            
            <p class="absolute bottom-8 sm:bottom-12 text-[#5a4c48] cursive text-3xl tracking-wider font-bold">
                que linda es la vida contigo
            </p>
        </div>
    </div>

    <script>
        const fotos = [
            'foto1.jpeg',
            'foto2.jpeg',
            'foto3.jpeg',
            'foto4.jpeg',
            'foto5.jpeg',
            'foto6.jpeg',
            'foto7.jpeg',
            'foto8.jpeg',
            'foto9.jpeg',
            'foto10.jpeg',
            'foto11.jpeg',
            'foto12.jpeg'
        ];
        
        let indiceFoto = 0;
        let alternate = false;
        const imgElement = document.getElementById('foto-actual');

        function abrirBaul() {
            // 1. Iniciar música
            const musica = document.getElementById('musica');
            musica.volume = 0.85; 
            musica.play();

            // 2. Mostrar aviso para subir el volumen
            const avisoVolumen = document.getElementById('aviso-volumen');
            avisoVolumen.classList.remove('hidden');
            setTimeout(() => {
                avisoVolumen.classList.remove('opacity-0');
            }, 50);

            // Ocultar el aviso suavemente después de 8 segundos
            setTimeout(() => {
                avisoVolumen.classList.add('opacity-0');
                setTimeout(() => avisoVolumen.classList.add('hidden'), 700);
            }, 8000);

            // 3. Desvanecer el cofre y abrir galería
            const escenaBaul = document.getElementById('escena-baul');
            escenaBaul.style.opacity = '0';
            
            setTimeout(() => {
                escenaBaul.classList.add('hidden');
                
                const escenaFotos = document.getElementById('escena-fotos');
                escenaFotos.classList.remove('hidden');
                escenaFotos.classList.add('flex');
                
                mostrarSiguienteFoto();
                setInterval(mostrarSiguienteFoto, 5000);
            }, 1000);
        }

        function mostrarSiguienteFoto() {
            imgElement.classList.remove('visible', 'visible-alt');
            
            setTimeout(() => {
                imgElement.src = fotos[indiceFoto];
                
                imgElement.onload = () => {
                    if(alternate) {
                        imgElement.classList.add('visible-alt');
                    } else {
                        imgElement.classList.add('visible');
                    }
                    alternate = !alternate;
                    
                    indiceFoto = (indiceFoto + 1) % fotos.length;
                };
            }, 1200); 
        }
    </script>
</body>
</html>
