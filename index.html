<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nuestro Baúl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Fondo con degradado cálido y masculino */
        body { 
            background: linear-gradient(135deg, #d5c3ba 0%, #bca59a 100%);
            overflow: hidden; 
            font-family: 'Poppins', sans-serif; 
            color: #4a3f3c; 
            touch-action: manipulation; 
        }
        .cursive { font-family: 'Dancing Script', cursive; }
        
        /* Animación del cofre flotando */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .float { animation: float 3s ease-in-out infinite; }
        
        /* Efecto Polaroid ajustado */
        .polaroid {
            background: #ffffff;
            padding: 12px 12px 50px 12px;
            box-shadow: 0 20px 40px rgba(74, 63, 60, 0.2); 
            border-radius: 2px;
            transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
            opacity: 0; 
            transform: scale(0.9) rotate(-3deg);
            max-width: 85vw;
            max-height: 65vh;
            object-fit: cover;
        }
        
        .polaroid.visible { opacity: 1; transform: scale(1) rotate(3deg); }
        .polaroid.visible-alt { opacity: 1; transform: scale(1) rotate(-2deg); }

        /* Estilo para el icono del cofre */
        .chest-icon {
            fill: #8a7369;
            transition: fill 0.3s ease;
        }
        .chest-container:hover .chest-icon {
            fill: #725d55;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <audio id="musica" src="cancion.mp3" loop></audio>

    <!-- ESCENA 1: EL COFRE -->
    <div id="escena-baul" class="flex flex-col items-center justify-center z-50 transition-opacity duration-1000 w-full px-6">
        <h2 class="text-[#5a4c48] text-lg sm:text-xl text-center mb-10 font-light tracking-wide">
            Buenos días amorcito y antioquia...<br>
            <span class="text-sm text-[#8a7369] animate-pulse mt-4 block">Toca el cofre para abrirlo</span>
        </h2>
        
        <!-- Icono de cofre detallado -->
        <div class="chest-container cursor-pointer float select-none" onclick="abrirBaul()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-32 h-32 drop-shadow-lg chest-icon">
                <path d="M4.5 10.5h15c.828 0 1.5-.672 1.5-1.5v-1.5c0-1.657-1.343-3-3-3h-12c-1.657 0-3 1.343-3 3v1.5c0 .828.672 1.5 1.5 1.5zM12 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" />
                <path d="M3 12v6.75A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V12H3zm9 3.75a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" />
            </svg>
        </div>
    </div>

    <!-- ESCENA 2: LAS FOTOS -->
    <div id="escena-fotos" class="hidden absolute inset-0 flex-col items-center justify-center z-10 w-full h-full">
        <div id="foto-container" class="relative flex items-center justify-center w-full h-full">
            <img id="foto-actual" src="" class="polaroid">
            
            <p class="absolute bottom-8 sm:bottom-12 text-[#5a4c48] cursive text-3xl drop-shadow-sm tracking-wider font-bold">
                Qué linda es la vida contigo
            </p>
        </div>
    </div>

    <script>
        // LISTA ACTUALIZADA CON 12 FOTOS
        const fotos = [
            'foto1.jpeg',
            'foto2.jpeg',
            'foto3.jpeg',
            'foto4.jpeg',
            'foto5.jpeg',
            'foto6.jpeg',
            'foto7.jpeg',
            'foto8.jpeg',
            'foto9.jpeg',
            'foto10.jpeg',
            'foto11.jpeg',
            'foto12.jpeg'
        ];
        
        let indiceFoto = 0;
        let alternate = false;
        const imgElement = document.getElementById('foto-actual');

        function abrirBaul() {
            const musica = document.getElementById('musica');
            musica.volume = 0.7; 
            musica.play();

            const escenaBaul = document.getElementById('escena-baul');
            escenaBaul.style.opacity = '0';
            
            setTimeout(() => {
                escenaBaul.classList.add('hidden');
                
                const escenaFotos = document.getElementById('escena-fotos');
                escenaFotos.classList.remove('hidden');
                escenaFotos.classList.add('flex');
                
                mostrarSiguienteFoto();
                setInterval(mostrarSiguienteFoto, 5000);
            }, 1000);
        }

        function mostrarSiguienteFoto() {
            imgElement.classList.remove('visible', 'visible-alt');
            
            setTimeout(() => {
                imgElement.src = fotos[indiceFoto];
                
                imgElement.onload = () => {
                    if(alternate) {
                        imgElement.classList.add('visible-alt');
                    } else {
                        imgElement.classList.add('visible');
                    }
                    alternate = !alternate;
                    
                    indiceFoto = (indiceFoto + 1) % fotos.length;
                };
            }, 1200); 
        }
    </script>
</body>
</html>
