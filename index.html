<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nuestro Baúl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Fondo color pastel mate (no brillante) */
        body { 
            background: linear-gradient(135deg, #f0e4e1 0%, #e1d5d1 100%);
            overflow: hidden; 
            font-family: 'Poppins', sans-serif; 
            color: #544845; 
            touch-action: manipulation; 
        }
        .cursive { font-family: 'Dancing Script', cursive; }
        
        /* Animación del cofre flotando */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .float { animation: float 3s ease-in-out infinite; }
        
        /* Efecto Polaroid ajustado para fondo claro */
        .polaroid {
            background: #ffffff;
            padding: 12px 12px 50px 12px;
            box-shadow: 0 15px 35px rgba(100, 80, 80, 0.15); /* Sombra más suave */
            border-radius: 2px;
            transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
            opacity: 0; 
            transform: scale(0.9) rotate(-3deg);
            max-width: 85vw;
            max-height: 65vh;
            object-fit: cover;
        }
        
        .polaroid.visible { opacity: 1; transform: scale(1) rotate(3deg); }
        .polaroid.visible-alt { opacity: 1; transform: scale(1) rotate(-2deg); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <audio id="musica" src="cancion.mp3" loop></audio>

    <!-- ESCENA 1: EL COFRE MINIMALISTA -->
    <div id="escena-baul" class="flex flex-col items-center justify-center z-50 transition-opacity duration-1000 w-full px-6">
        <h2 class="text-[#6b5b58] text-lg sm:text-xl text-center mb-10 font-light tracking-wide">
            Hay recuerdos que brillan para siempre...<br>
            <span class="text-sm text-[#9c8985] animate-pulse mt-4 block">Toca el cofre para abrirlo</span>
        </h2>
        
        <!-- Icono de cofre en vez de emoji -->
        <div class="cursor-pointer float select-none text-[#8c746e] hover:text-[#a68c85] transition-colors duration-300" onclick="abrirBaul()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-32 h-32 drop-shadow-md">
                <path d="M4.5 9h15A1.5 1.5 0 0 0 21 7.5V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v1.5A1.5 1.5 0 0 0 4.5 9z" />
                <path d="M3 10.5v8.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75v-8.25H3zm7.5 0v2.25c0 .414.336.75.75.75h1.5a.75.75 0 0 0 .75-.75V10.5H10.5z" />
            </svg>
        </div>
    </div>

    <!-- ESCENA 2: LAS FOTOS -->
    <div id="escena-fotos" class="hidden absolute inset-0 flex-col items-center justify-center z-10 w-full h-full">
        <div id="foto-container" class="relative flex items-center justify-center w-full h-full">
            <img id="foto-actual" src="" class="polaroid">
            
            <p class="absolute bottom-8 sm:bottom-12 text-[#9c8985] cursive text-3xl drop-shadow-sm tracking-wider">
                Brillante sobre el mic...
            </p>
        </div>
    </div>

    <script>
        const fotos = [
            'foto1.jpeg',
            'foto2.jpeg',
            'foto3.jpeg',
            'foto4.jpeg',
            'foto5.jpeg',
            'foto6.jpeg',
            'foto7.jpeg',
            'foto8.jpeg',
            'foto9.jpeg',
            'foto10.jpeg'
        ];
        
        let indiceFoto = 0;
        let alternate = false;
        const imgElement = document.getElementById('foto-actual');

        function abrirBaul() {
            const musica = document.getElementById('musica');
            musica.volume = 0.7; 
            musica.play();

            const escenaBaul = document.getElementById('escena-baul');
            escenaBaul.style.opacity = '0';
            
            setTimeout(() => {
                escenaBaul.classList.add('hidden');
                
                const escenaFotos = document.getElementById('escena-fotos');
                escenaFotos.classList.remove('hidden');
                escenaFotos.classList.add('flex');
                
                mostrarSiguienteFoto();
                setInterval(mostrarSiguienteFoto, 5000);
            }, 1000);
        }

        function mostrarSiguienteFoto() {
            imgElement.classList.remove('visible', 'visible-alt');
            
            setTimeout(() => {
                imgElement.src = fotos[indiceFoto];
                
                imgElement.onload = () => {
                    if(alternate) {
                        imgElement.classList.add('visible-alt');
                    } else {
                        imgElement.classList.add('visible');
                    }
                    alternate = !alternate;
                    
                    indiceFoto = (indiceFoto + 1) % fotos.length;
                };
            }, 1200); 
        }
    </script>
</body>
</html>
